*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--color-base);
  color: var(--color-text);
  font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 15px;
  line-height: 1.7;
}
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
a { color: var(--color-accent-strong); }
:root { --scrollbar-thumb: color-mix(in srgb, var(--color-muted) 45%, transparent); }
* { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) transparent; }
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.9em; }
.icon { flex: none; }

/* 見本のページの上の、テーマを切り替える帯（アプリの部品ではない） */
.theme-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px;
  padding: 8px 16px; border-bottom: 1px dashed var(--color-border);
  background: var(--color-base); font-size: 13px;
}
.theme-bar__label { color: var(--color-muted); margin-right: 4px; display: inline-flex; align-items: center; gap: 6px; }
.theme-bar__back { margin-left: auto; font-size: 13px; }
.theme-bar button {
  font: inherit; font-size: 12px; min-height: 30px; padding: 2px 10px;
  border: 1px solid var(--color-border); border-radius: 999px;
  background: var(--color-base); color: var(--color-text); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.theme-bar button[aria-pressed="true"] { border-color: var(--color-accent); background: var(--color-surface); font-weight: 600; }
.theme-bar__swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgb(0 0 0 / 0.2); }

.doc { max-width: 76rem; margin: 0 auto; padding: 28px 32px 80px; }
@media (max-width: 899px) { .doc { padding: 20px 16px 64px; } }
.doc > h1 { font-size: 22px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.lead { margin: 0 0 24px; color: var(--color-muted); font-size: 14px; }
.doc h2.kit-title { font-size: 18px; margin: 32px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.doc h3.kit-sub { font-size: 14px; margin: 16px 0 8px; color: var(--color-muted); font-weight: 600; }
.note { margin: 8px 0 0; font-size: 12px; color: var(--color-muted); }

/* ===== 部品（各アプリの CSS Modules と同じ値） ===== */
.button {
  font: inherit; font-size: 14px; line-height: 1.4;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 16px; border-radius: 8px; border: 1px solid transparent;
  cursor: pointer; text-decoration: none; white-space: nowrap;
}
.button:disabled { opacity: 0.55; cursor: not-allowed; }
.primary { background: var(--color-accent-strong); color: var(--color-on-accent-strong); }
.secondary { background: var(--color-base); color: var(--color-text); border-color: var(--color-accent); }
.ghost { background: transparent; color: var(--color-accent-strong); }
.ghost:hover:not(:disabled) { background: var(--color-surface); }
.danger { background: var(--color-danger); color: var(--color-on-danger); }
.small { min-height: 32px; padding: 4px 12px; font-size: 13px; }
.block { width: 100%; }
.spinner {
  display: inline-block; width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid currentColor; border-right-color: transparent;
  animation: spin 0.8s linear infinite; flex: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

.field { display: grid; gap: 4px; }
.field__row { display: flex; align-items: stretch; gap: 8px; }
.field__row > :last-child { flex-shrink: 0; }
.field__label { font-size: 13px; }
.input {
  font: inherit; width: 100%; padding: 8px 10px; min-height: 40px;
  border: 1px solid var(--color-border); border-radius: 8px;
  background: var(--color-base); color: var(--color-text);
}
.input::placeholder { color: var(--color-muted); }
.input:focus, .input.is-focused { outline: 2px solid var(--color-accent); outline-offset: 0; border-color: var(--color-accent); }
.input.is-invalid { border-color: var(--color-danger); }
.field__description { font-size: 12px; color: var(--color-muted); overflow-wrap: anywhere; }
.field__error { font-size: 12px; color: var(--color-danger); }
textarea.input { min-height: 96px; resize: vertical; line-height: 1.7; }

.dialog-stage {
  position: relative; display: grid; place-items: center; padding: 32px 16px;
  border-radius: 12px; background: rgb(30 25 20 / 0.45);
}
.modal {
  display: flex; flex-direction: column; width: min(440px, 100%);
  border: 1px solid var(--color-border); border-radius: 14px;
  background: var(--color-base); color: var(--color-text);
  box-shadow: 0 10px 40px rgb(0 0 0 / 0.25);
}
.modal--wide { width: min(880px, 100%); }
.modal__body { padding: 18px 20px 16px; }
.modal__heading { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 17px; }
.modal__form { display: grid; gap: 12px; }
.modal__text { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
.modal__actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.modal__danger-action { margin-right: auto; color: var(--color-danger); }

.section {
  display: grid; gap: 8px; min-width: 0; padding: 14px 16px;
  border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-surface);
}
.section__header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.section__heading { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-size: 16px; }
.count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 22px; padding: 0 6px;
  border: 1px solid var(--color-accent); border-radius: 999px;
  color: var(--color-accent-strong); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.section__updated { margin-left: auto; font-size: 12px; color: var(--color-muted); white-space: nowrap; }
.section__note { margin: 0; font-size: 14px; color: var(--color-muted); }
.section__body { display: grid; gap: 8px; min-width: 0; }

.band {
  display: flex; align-items: center; gap: 8px; margin: 0; padding: 6px 10px;
  border: 1px solid var(--color-danger-border); border-left-width: 4px; border-radius: 8px;
  background: var(--color-danger-bg); color: var(--color-danger); font-size: 13px;
}
.band--warning { border-color: var(--color-warning-border); background: var(--color-warning-bg); color: var(--color-warning); }
.band--info { border-color: var(--color-info-border); background: var(--color-info-bg); color: var(--color-text); padding: 10px 14px; border-radius: 10px; font-size: 14px; align-items: flex-start; }
.band--info .icon { color: var(--color-info); margin-top: 3px; }
.band--success { border-color: var(--color-success-border); background: var(--color-success-bg); color: var(--color-success); }

.rows { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.row {
  display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; padding: 6px 10px;
  border: 1px solid var(--color-border); border-radius: 10px; background: var(--color-base); font-size: 14px;
  position: relative;
}
.row--draft { border-style: dashed; color: var(--color-muted); }
.row--banded { padding-left: 16px; overflow: hidden; }
.row__band { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--extra-dot, var(--color-border)); }
.row__key { flex: none; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row__main { display: grid; gap: 1px; flex: 1 1 12rem; min-width: 0; }
.row__title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 12px; color: var(--color-muted); }
.row__cell { flex: none; font-size: 13px; color: var(--color-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row__hours { flex: none; min-width: 3.4rem; text-align: right; font-variant-numeric: tabular-nums; }
.row__actions { display: flex; flex: none; align-items: center; gap: 2px; margin-left: auto; }
.due-today { color: var(--color-warning); font-weight: 600; }
.overdue { color: var(--color-danger); font-weight: 600; }
.menu-button {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 32px; height: 32px; padding: 0; border: 0; border-radius: 6px;
  background: transparent; color: var(--color-muted); cursor: pointer;
}
.menu-button:hover { background: var(--color-surface); color: var(--color-text); }

.tag { padding: 0 6px; border: 1px solid var(--color-border); border-radius: 999px; background: var(--color-surface); font-size: 11px; white-space: nowrap; }
.badge {
  display: inline-flex; align-items: center; gap: 3px; font-size: 12px; padding: 0 9px;
  border-radius: 999px; border: 1px solid; line-height: 1.8; white-space: nowrap;
}
.badge--success { color: var(--color-success); background: var(--color-success-bg); border-color: var(--color-success-border); }
.badge--warning { color: var(--color-warning); background: var(--color-warning-bg); border-color: var(--color-warning-border); }
.badge--danger { color: var(--color-danger); background: var(--color-danger-bg); border-color: var(--color-danger-border); }
.badge--info { color: var(--color-info); background: var(--color-info-bg); border-color: var(--color-info-border); }
.badge--muted { color: var(--color-muted); background: var(--color-surface); border-color: var(--color-border); }
.chips { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; }
.chip {
  flex-shrink: 0; max-width: 10em; padding: 0 8px; border: 1px solid var(--color-border);
  border-radius: 999px; font-size: 12px; line-height: 1.7; color: var(--color-text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chips__rest { flex-shrink: 0; font-size: 12px; color: var(--color-muted); }
.extra-badge {
  display: inline-block; max-width: 14rem; padding: 0 7px;
  border: 1px solid var(--extra-border, var(--color-border)); border-radius: 6px;
  background: var(--extra-bg, transparent); color: var(--extra-text, var(--color-muted));
  font-size: 12px; line-height: 18px; vertical-align: middle;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: none;
}
.mark { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.mark--danger { color: var(--color-danger); }
.mark--warning { color: var(--color-warning); }
.mark--success { color: var(--color-success); }
.mark--muted { color: var(--color-muted); }
.extra-badge .icon { vertical-align: -2px; margin-right: 4px; }
.extra-dot { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; vertical-align: 1px; background: var(--extra-dot); }

.empty { display: grid; justify-items: center; gap: 6px; padding: 24px 16px; color: var(--color-muted); font-size: 14px; text-align: center; }
.empty .icon { color: var(--color-accent); }

.popover {
  min-width: 220px; padding: 4px; background: var(--color-base);
  border: 1px solid var(--color-border); border-radius: 10px; box-shadow: 0 6px 20px rgb(0 0 0 / 0.15);
}
.menu-item { font-size: 14px; padding: 8px 10px; border-radius: 6px; display: flex; align-items: center; gap: 10px; color: var(--color-text); }
.menu-item.is-focused { background: var(--color-surface); }
.menu-item__check { margin-left: auto; color: var(--color-accent-strong); }

/* ヘッダー */
.app-header {
  display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 12px;
  background: var(--color-surface); border-bottom: 1px solid var(--color-border);
}
.logo { display: inline-flex; align-items: center; gap: 0.3em; line-height: 1; color: var(--color-text); white-space: nowrap; font-size: 18px; text-decoration: none; min-height: 40px; }
.logo-mark { width: 1.3em; height: 1.3em; flex: none; }
.logo-type { font-family: "Fraunces Variable", "Fraunces", Georgia, "Times New Roman", serif; font-weight: 500; letter-spacing: 0.02em; font-variation-settings: "SOFT" 50; }
.nav { display: flex; align-items: center; gap: 2px; min-width: 0; }
.nav-link, .icon-button {
  font: inherit; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 40px; min-height: 40px; padding: 6px 10px; border-radius: 8px; white-space: nowrap;
}
.nav-link { color: var(--color-muted); text-decoration: none; }
.nav-link:hover { background: var(--color-base); color: var(--color-text); }
.nav-link--active { color: var(--color-text); font-weight: 600; }
.icon-button { border: 1px solid transparent; background: transparent; color: var(--color-text); cursor: pointer; }
.icon-button:hover { background: var(--color-base); }
.header-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* 見本では、画面の幅の代わりに枠の幅で崩す（コンテナクエリ）。アプリでは同じ値を @media で書く */
.app { container-type: inline-size; container-name: app; }
@container app (max-width: 599px) {
  .button-text { display: none; }
  .app-header { gap: 4px; padding: 0 8px; }
  .header-actions, .nav { gap: 0; }
  .icon-button, .nav-link { min-width: 36px; padding: 6px 8px; }
    .row__main { flex-basis: calc(100% - 6rem); }
  .row__actions { flex-basis: 100%; justify-content: flex-end; }
}

.index-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.index-card { display: flex; gap: 12px; align-items: flex-start; height: 100%; padding: 14px 16px; border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-surface); color: var(--color-text); text-decoration: none; }
.index-card:hover { border-color: var(--color-accent); }
.index-card b { display: block; font-size: 16px; }
.index-card span span { display: block; font-size: 13px; color: var(--color-muted); }
.index-card__icon { color: var(--color-accent-strong); margin-top: 2px; }

</style>

<script>
  (() => {
    const KEY = "souan.samples.theme";
    const themes = ["system", "hakushi", "hanshi", "torinoko", "kinari", "washi", "koshi", "yofukashi"];
    const read = () => {
      const fromUrl = new URLSearchParams(location.search).get("theme");
      if (themes.includes(fromUrl)) return fromUrl;
      try {
        const saved = localStorage.getItem(KEY);
        return themes.includes(saved) ? saved : "system";
      } catch {
        return "system";
      }
    };
    const apply = (choice) => {
      if (choice === "system") delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = choice;
      document.querySelectorAll("[data-theme-choice]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.themeChoice === choice));
      });
      document.dispatchEvent(new CustomEvent("souan:theme"));
    };
    // 描く前に当てて、ちらつかないようにする
    apply(read());
    document.addEventListener("DOMContentLoaded", () => {
      apply(read());
      document.querySelectorAll("[data-theme-choice]").forEach((button) => {
        button.addEventListener("click", () => {
          const choice = button.dataset.themeChoice;
          try { localStorage.setItem(KEY, choice); } catch { /* 保存できなくても今の画面には反映する */ }
          apply(choice);
        });
      });
    });
  })();
</script>
