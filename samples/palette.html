/* 白紙（既定） */
:root,
:root[data-theme="hakushi"] {
  color-scheme: light;
  --color-accent: #859a93;
  --color-accent-strong: #5e736c;
  --color-on-accent-strong: #fffcf7;
  --color-base: #fffcf7;
  --color-surface: #f9f6f0;
  --color-border: #e7e3dc;
  --color-text: #544739;
  --color-muted: #766959;

  --color-warning: #85651c;
  --color-warning-bg: #f8f0da;
  --color-warning-border: #dcc48a;
  --color-danger: #a04a3e;

  --color-danger-border: #ddaa9f;
  --color-info: #4d6a84;
  --color-info-bg: #e8eef3;
  --color-info-border: #a9bccd;
  --color-on-danger: #fffcf7;
  /* コードの色分け（Shiki の CSS 変数テーマ）。背景はサーフェス、文字の色はすべて背景の上で 4.5 以上 */

<script>
  (() => {
    const KEY = "souan.samples.theme";
    const themes = ["system", "hakushi", "hanshi", "torinoko", "kinari", "washi", "koshi", "sumi", "irogami", "yofukashi", "urushi", "ai", "fukamidori", "keshizumi", "budou"];
    const read = () => {
      const fromUrl = new URLSearchParams(location.search).get("theme");
      if (themes.includes(fromUrl)) return fromUrl;
      try {
        const saved = localStorage.getItem(KEY);
        return themes.includes(saved) ? saved : "system";
      } catch {
        return "system";
      }

    const apply = (choice) => {
      if (choice === "system") delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = choice;

        button.setAttribute("aria-pressed", String(button.dataset.themeChoice === choice));
      });
      document.dispatchEvent(new CustomEvent("souan:theme"));
    };
    // 描く前に当てて、ちらつかないようにする
    apply(read());

      apply(read());
      document.querySelectorAll("[data-theme-choice]").forEach((button) => {
